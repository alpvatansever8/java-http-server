plugins {
    id 'java'
    id 'application'
}

group = 'com.alpvatansever.httpserver'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

java {
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

application {
    mainClass = 'com.alpvatansever.httpserver.Main'
}
